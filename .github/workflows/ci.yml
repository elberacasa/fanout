name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The source suite cannot see a broken tarball: a missing runtime asset, a path the compiler could not rewrite,
  # a version that no longer matches. Every one of those passed `pnpm check` while it was broken. Node 22 because
  # it is the oldest we claim to support and therefore the one most likely to be the problem.
  pack:
    name: installs from empty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pack

  commits:
    name: commit standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit message in this change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="${BASE:+$BASE..}$HEAD"
          [ -n "$BASE" ] || range="$HEAD~1..$HEAD"
          failed=0
          for commit in $(git rev-list --no-merges "$range"); do
            # Bots write their own fixed format; the standard is for people and for our agents.
            case "$(git log -1 --format='%an' "$commit")" in dependabot*) continue ;; esac
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::$(git log -1 --format='%h %s' "$commit")"
              failed=1
            fi
          done
          exit $failed
